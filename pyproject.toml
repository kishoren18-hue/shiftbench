[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftbench"
version = "0.1.0"
description = "Do robot failure alarms keep their promise after the camera moves? A benchmark and an adaptive fix for cheap arms."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "torch>=2.2", "pyyaml>=6"]

[project.optional-dependencies]
vjepa = ["transformers>=4.53"]
lerobot = ["lerobot>=0.7"]
dev = ["pytest>=7", "scikit-learn>=1.3"]

[project.scripts]
shiftbench-label = "shiftbench.labeling:main"
rolloutcheck = "shiftbench.rolloutcheck:main"

[tool.setuptools]
packages = ["shiftbench"]
